<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Order Status Update #{{ order.order_number }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #0d6efd; color: white; padding: 20px; text-align: center; border-radius: 6px 6px 0 0;">
        <h2 style="margin: 0;">Order Status Update</h2>
    </div>
    <div style="border: 1px solid #dee2e6; border-top: none; padding: 20px; border-radius: 0 0 6px 6px;">
        <p>Dear {{ order.user.username }},</p>
        <p>Your order <strong>#{{ order.order_number }}</strong> status has been updated to: <span style="font-size: 1.1em; font-weight: bold; color: #0d6efd;">{{ new_status }}</span>.</p>
        {% if notes %}
        <p><strong>Note:</strong> {{ notes }}</p>
        {% endif %}
        <p>Order Total: <strong>৳{{ order.total_amount }}</strong></p>
        <hr style="border: none; border-top: 1px solid #dee2e6; margin: 20px 0;">
        <p style="font-size: 0.9em; color: #6c757d; text-align: center;">You can track your order status anytime on your account orders page.</p>
    </div>
</body>
</html>
