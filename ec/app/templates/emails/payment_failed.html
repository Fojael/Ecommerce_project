<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Failed #{{ order.order_number }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #dc3545; color: white; padding: 20px; text-align: center; border-radius: 6px 6px 0 0;">
        <h2 style="margin: 0;">Payment Failed</h2>
    </div>
    <div style="border: 1px solid #dee2e6; border-top: none; padding: 20px; border-radius: 0 0 6px 6px;">
        <p>Dear {{ order.user.username }},</p>
        <p>Your payment attempt for order <strong>#{{ order.order_number }}</strong> could not be completed.</p>
        {% if reason %}
        <p><strong>Reason:</strong> {{ reason }}</p>
        {% endif %}
        <p>You can retry paying for your order from your orders page.</p>
        <hr style="border: none; border-top: 1px solid #dee2e6; margin: 20px 0;">
        <p style="font-size: 0.9em; color: #6c757d; text-align: center;">If you need assistance, please contact customer support.</p>
    </div>
</body>
</html>
